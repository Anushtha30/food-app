<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appétit</title>
    <link rel="stylesheet" href="food.css">
</head>
<body>
    <div class="appetit-container">
        <div class="appetit-card">
            <h1 class="appetit-title">Appétit</h1>
            <div class="appetit-decor">
                <span class="dot red"></span>
                <span class="dot blue"></span>
                <span class="dot yellow"></span>
            </div>
            <div class="appetit-images">
                <img src="" alt="Food Left" class="food-image left">
                <img src="" alt="Food Right" class="food-image right">
            </div>
        </div>
    </div>
    <script src="food.js"></script>
</body>
</html>
